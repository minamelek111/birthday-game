<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Our Memories 🎂</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="game-container">

        <div id="viewport">

            <canvas id="game"></canvas>

            <div id="touch-controls">

                <div id="touch-dpad">
                    <button class="touch-btn" id="btn-up" data-key="arrowup">▲</button>
                    <button class="touch-btn" id="btn-left" data-key="arrowleft">◀</button>
                    <button class="touch-btn" id="btn-right" data-key="arrowright">▶</button>
                    <button class="touch-btn" id="btn-down" data-key="arrowdown">▼</button>
                </div>

                <button class="touch-btn touch-action" id="btn-interact" data-key="e">E</button>

            </div>

        </div>

        <div id="start-screen">
            <div id="start-screen-inner">
                <div id="start-emoji">🎂✨</div>
                <h1>happy birthday</h1>
                <p>I’ve prepared a little room just for you</p>
                <button id="start-button">start</button>
            </div>
        </div>

        <div id="message-box" class="hidden">

            <div id="memory-popup">

                <video id="memory-video" controls playsinline>
                    <source src="assets/memories.mp4" type="video/mp4">
                </video>

                <h2>the moments we shared together</h2>

                <p id="memory-text">
                </p>

            </div>

        </div>

    </div>

    <script src="game.js"></script>
</body>
</html>
